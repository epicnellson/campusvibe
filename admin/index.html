<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CampusVibe Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-deep: #0b0b12;
      --bg-card: #14141f;
      --bg-elevated: #1c1c2e;
      --bg-hover: #1a1a28;
      --bg-active: #22223a;
      --border: #1e1e2e;
      --border-light: #2a2a3e;
      --primary: #6C47FF;
      --primary-hover: #5a3ad6;
      --primary-glow: rgba(108,71,255,0.15);
      --primary-subtle: rgba(108,71,255,0.08);
      --success: #34c759;
      --success-subtle: rgba(52,199,89,0.1);
      --warning: #ff9500;
      --warning-subtle: rgba(255,149,0,0.1);
      --danger: #ff3b30;
      --danger-subtle: rgba(255,59,48,0.1);
      --info: #5ac8fa;
      --info-subtle: rgba(90,200,250,0.1);
      --text-primary: #f0f0f5;
      --text-secondary: #9090a8;
      --text-muted: #606080;
      --radius-xs: 6px;
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-xl: 20px;
      --sidebar-w: 260px;
      --topbar-h: 56px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg-deep); color: var(--text-primary);
      min-height: 100vh; -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border-light); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }
    a { color: var(--primary); text-decoration: none; }

    /* ─── Login ─── */
    .login-page {
      min-height: 100vh; display: flex; align-items: center;
      justify-content: center; padding: 20px;
      background: radial-gradient(ellipse at 50% 0%, #14141f 0%, var(--bg-deep) 70%);
    }
    .login-card {
      width: 100%; max-width: 380px;
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: var(--radius-xl); padding: 44px 32px 32px;
      box-shadow: 0 4px 40px rgba(0,0,0,0.3);
    }
    .login-card .logo {
      display: flex; align-items: center; gap: 10px; margin-bottom: 6px;
    }
    .login-card .logo h1 { font-size: 20px; font-weight: 700; letter-spacing: -0.3px; }
    .login-card .subtitle { color: var(--text-muted); font-size: 13px; margin-bottom: 28px; }
    .login-card .field-group { margin-bottom: 16px; }
    .login-card .field-group label {
      display: block; font-size: 11px; font-weight: 600;
      color: var(--text-secondary); margin-bottom: 6px;
      text-transform: uppercase; letter-spacing: 0.5px;
    }
    .login-card input {
      width: 100%; padding: 11px 14px;
      background: var(--bg-elevated); border: 1px solid var(--border-light);
      border-radius: var(--radius-sm);
      color: var(--text-primary); font-size: 13px; font-family: inherit;
      outline: none; transition: 0.15s;
    }
    .login-card input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-glow); }
    .login-card input::placeholder { color: var(--text-muted); }
    .login-card .error { color: var(--danger); font-size: 12px; margin-bottom: 14px; min-height: 18px; }

    /* ─── Layout ─── */
    .app-layout { display: flex; height: 100vh; }
    .app-layout.login-active { display: block; }

    /* ─── Sidebar ─── */
    .sidebar {
      width: var(--sidebar-w); background: var(--bg-card);
      border-right: 1px solid var(--border);
      display: flex; flex-direction: column;
      position: fixed; top: 0; left: 0; bottom: 0; z-index: 200;
      transition: transform 0.25s cubic-bezier(0.4,0,0.2,1);
    }
    .sidebar-header {
      padding: 20px 20px 16px;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 12px;
    }
    .sidebar-logo {
      width: 36px; height: 36px; border-radius: 10px;
      background: var(--primary); display: flex;
      align-items: center; justify-content: center; flex-shrink: 0;
    }
    .sidebar-brand { font-size: 17px; font-weight: 700; letter-spacing: -0.3px; }
    .sidebar-brand-accent { color: var(--primary); }
    .sidebar-nav {
      flex: 1; overflow-y: auto; padding: 12px 10px;
    }
    .nav-group-label {
      font-size: 10px; font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.8px; color: var(--text-muted);
      padding: 16px 10px 6px;
    }
    .nav-item {
      display: flex; align-items: center; gap: 10px;
      padding: 9px 12px; border-radius: var(--radius-sm);
      font-size: 13px; font-weight: 500;
      color: var(--text-secondary); cursor: pointer;
      transition: 0.15s; border: none; background: none;
      width: 100%; text-align: left; font-family: inherit;
    }
    .nav-item:hover { background: var(--bg-hover); color: var(--text-primary); }
    .nav-item.active { background: var(--primary-subtle); color: var(--primary); font-weight: 600; }
    .nav-item svg { width: 18px; height: 18px; flex-shrink: 0; opacity: 0.7; }
    .nav-item.active svg { opacity: 1; }
    .nav-badge {
      margin-left: auto; background: var(--danger);
      color: #fff; font-size: 10px; font-weight: 700;
      padding: 1px 7px; border-radius: 10px; min-width: 18px;
      text-align: center;
    }
    .nav-badge.warn { background: var(--warning); }
    .sidebar-footer {
      padding: 12px 14px;
      border-top: 1px solid var(--border);
      display: flex; align-items: center; gap: 10px;
    }
    .sidebar-footer .admin-avatar {
      width: 32px; height: 32px; border-radius: 50%;
      background: var(--bg-elevated); display: flex;
      align-items: center; justify-content: center;
      font-size: 13px; font-weight: 600; color: var(--text-muted);
      flex-shrink: 0;
    }
    .sidebar-footer .admin-info { flex: 1; min-width: 0; }
    .sidebar-footer .admin-name {
      font-size: 12px; font-weight: 600; color: var(--text-primary);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .sidebar-footer .admin-role { font-size: 11px; color: var(--text-muted); }
    .sidebar-footer .logout-btn {
      background: none; border: none; color: var(--text-muted);
      cursor: pointer; padding: 6px; border-radius: 6px;
      display: flex; transition: 0.15s;
    }
    .sidebar-footer .logout-btn:hover { background: var(--bg-hover); color: var(--danger); }

    /* ─── Main ─── */
    .main-area {
      flex: 1; margin-left: var(--sidebar-w);
      display: flex; flex-direction: column; height: 100vh;
      overflow: hidden;
    }
    .main-topbar {
      height: var(--topbar-h); display: flex;
      align-items: center; justify-content: space-between;
      padding: 0 28px;
      border-bottom: 1px solid var(--border);
      background: rgba(11,11,18,0.85);
      backdrop-filter: blur(12px);
      position: sticky; top: 0; z-index: 100;
      flex-shrink: 0;
    }
    .topbar-left { display: flex; align-items: center; gap: 12px; }
    .topbar-left h1 {
      font-size: 16px; font-weight: 600; letter-spacing: -0.2px;
    }
    .topbar-right {
      display: flex; align-items: center; gap: 12px;
    }
    .topbar-right .sync-btn {
      background: none; border: 1px solid var(--border-light);
      color: var(--text-secondary); padding: 6px 14px;
      border-radius: var(--radius-xs); font-size: 12px;
      font-weight: 500; cursor: pointer; font-family: inherit;
      display: flex; align-items: center; gap: 6px;
      transition: 0.15s;
    }
    .topbar-right .sync-btn:hover {
      background: var(--bg-hover); border-color: var(--primary);
      color: var(--primary);
    }
    .online-dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--success); flex-shrink: 0;
    }
    .mobile-menu-btn {
      display: none; background: none; border: none;
      color: var(--text-secondary); cursor: pointer;
      padding: 6px; border-radius: 6px;
    }
    .mobile-menu-btn:hover { background: var(--bg-hover); }

    /* ─── Content ─── */
    .main-scroll {
      flex: 1; overflow-y: auto; overflow-x: hidden;
    }
    .page { display: none; padding: 28px; max-width: 1200px; }
    .page.active { display: block; }

    /* ─── Cards ─── */
    .card {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: var(--radius-lg); overflow: hidden;
    }
    .card-pad { padding: 20px 24px; }
    .card-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 24px;
      border-bottom: 1px solid var(--border);
    }
    .card-header h2 { font-size: 14px; font-weight: 600; letter-spacing: -0.1px; }
    .card-header .count-badge {
      font-size: 11px; padding: 2px 10px; border-radius: 10px;
      font-weight: 600;
    }

    /* ─── Stat Cards ─── */
    .stat-grid {
      display: grid; grid-template-columns: repeat(3, 1fr);
      gap: 14px; margin-bottom: 28px;
    }
    .stat-card {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: var(--radius-md); padding: 18px 20px;
      transition: 0.15s; cursor: default;
    }
    .stat-card:hover { border-color: var(--border-light); }
    .stat-card .stat-top {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 10px;
    }
    .stat-card .stat-icon {
      width: 36px; height: 36px; border-radius: 9px;
      display: flex; align-items: center; justify-content: center;
    }
    .stat-card .stat-value {
      font-size: 26px; font-weight: 700; letter-spacing: -0.5px; line-height: 1.1;
    }
    .stat-card .stat-label {
      font-size: 12px; color: var(--text-muted); margin-top: 4px;
    }
    .stat-card .stat-trend {
      font-size: 11px; margin-top: 8px; display: inline-flex;
      align-items: center; gap: 4px; padding: 2px 8px;
      border-radius: 6px; font-weight: 500;
    }
    .stat-trend.up { color: var(--success); background: var(--success-subtle); }
    .stat-trend.warn { color: var(--warning); background: var(--warning-subtle); }
    .stat-trend.info { color: var(--info); background: var(--info-subtle); }
    .icon-purple { background: var(--primary-subtle); color: var(--primary); }
    .icon-orange { background: var(--warning-subtle); color: var(--warning); }
    .icon-green { background: var(--success-subtle); color: var(--success); }
    .icon-red { background: var(--danger-subtle); color: var(--danger); }
    .icon-blue { background: var(--info-subtle); color: var(--info); }

    /* ─── Quick Actions ─── */
    .section-title {
      font-size: 13px; font-weight: 600; color: var(--text-secondary);
      margin-bottom: 14px; text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .action-grid {
      display: grid; grid-template-columns: repeat(3, 1fr);
      gap: 12px; margin-bottom: 28px;
    }
    .action-card {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: var(--radius-md); padding: 16px 18px;
      cursor: pointer; transition: 0.15s;
      display: flex; align-items: flex-start; gap: 14px;
    }
    .action-card:hover {
      border-color: var(--border-light); background: var(--bg-hover);
      transform: translateY(-1px);
    }
    .action-card .action-icon {
      width: 38px; height: 38px; border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .action-card .action-icon svg { width: 18px; height: 18px; }
    .action-card .action-title {
      font-size: 13px; font-weight: 600; color: var(--text-primary);
      margin-bottom: 2px;
    }
    .action-card .action-desc {
      font-size: 11px; color: var(--text-muted); line-height: 1.4;
    }

    /* ─── Activity Feed ─── */
    .activity-list { display: flex; flex-direction: column; }
    .activity-item {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
    }
    .activity-item:last-child { border-bottom: none; }
    .activity-dot {
      width: 8px; height: 8px; border-radius: 50%;
      flex-shrink: 0;
    }
    .activity-dot.join { background: var(--success); }
    .activity-dot.flag { background: var(--danger); }
    .activity-dot.verify { background: var(--warning); }
    .activity-text { font-size: 13px; color: var(--text-secondary); flex: 1; }
    .activity-text strong { color: var(--text-primary); font-weight: 500; }
    .activity-time { font-size: 11px; color: var(--text-muted); white-space: nowrap; }

    /* ─── Data Table ─── */
    .table-wrap { overflow-x: auto; }
    table.data-table { width: 100%; border-collapse: collapse; }
    table.data-table thead { background: var(--bg-elevated); }
    table.data-table th {
      padding: 10px 16px; font-size: 11px; font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.5px;
      color: var(--text-muted); text-align: left;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    table.data-table td {
      padding: 12px 16px; font-size: 13px;
      border-bottom: 1px solid var(--border);
      color: var(--text-secondary);
    }
    table.data-table tr:last-child td { border-bottom: none; }
    table.data-table tr:hover td { background: var(--bg-hover); }
    .user-name-cell { color: var(--text-primary); font-weight: 500; }
    .user-email-cell { font-size: 11px; color: var(--text-muted); }
    .table-empty {
      padding: 56px 20px; text-align: center; color: var(--text-muted);
      font-size: 13px;
    }
    .table-empty svg { opacity: 0.3; margin-bottom: 12px; }

    /* ─── Badges ─── */
    .badge {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 3px 10px; border-radius: 6px;
      font-size: 11px; font-weight: 600; white-space: nowrap;
    }
    .badge::before {
      content: ""; width: 5px; height: 5px; border-radius: 50%;
    }
    .badge-approved { background: var(--success-subtle); color: var(--success); }
    .badge-approved::before { background: var(--success); }
    .badge-pending { background: var(--warning-subtle); color: var(--warning); }
    .badge-pending::before { background: var(--warning); }
    .badge-rejected { background: var(--danger-subtle); color: var(--danger); }
    .badge-rejected::before { background: var(--danger); }
    .badge-none { background: var(--bg-elevated); color: var(--text-muted); }
    .badge-none::before { background: var(--text-muted); }
    .badge-post { background: var(--primary-subtle); color: var(--primary); }
    .badge-confession { background: var(--warning-subtle); color: var(--warning); }
    .badge-listing { background: var(--success-subtle); color: var(--success); }
    .badge-event { background: var(--info-subtle); color: var(--info); }

    /* ─── Buttons ─── */
    .btn {
      padding: 8px 18px; border: none; border-radius: var(--radius-xs);
      font-size: 13px; font-weight: 600; font-family: inherit;
      cursor: pointer; transition: 0.15s;
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover:not(:disabled) { background: var(--primary-hover); }
    .btn-success { background: var(--success); color: #fff; }
    .btn-success:hover:not(:disabled) { background: #2db84e; }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-danger:hover:not(:disabled) { background: #e0352b; }
    .btn-ghost {
      background: transparent; color: var(--text-secondary);
      border: 1px solid var(--border-light);
    }
    .btn-ghost:hover:not(:disabled) {
      background: var(--bg-elevated); color: var(--text-primary);
    }
    .btn-outline {
      background: transparent; color: var(--text-primary);
      border: 1px solid var(--border-light);
    }
    .btn-outline:hover:not(:disabled) {
      background: var(--bg-elevated); border-color: var(--primary);
      color: var(--primary);
    }
    .btn-danger-ghost {
      background: transparent; color: var(--danger);
      border: 1px solid rgba(255,59,48,0.2);
    }
    .btn-danger-ghost:hover:not(:disabled) { background: var(--danger-subtle); }
    .btn-sm { padding: 5px 12px; font-size: 12px; }
    .btn-xs { padding: 4px 10px; font-size: 11px; border-radius: 5px; }

    /* ─── Inputs ─── */
    .search-wrap { position: relative; flex: 1; min-width: 200px; }
    .search-wrap input {
      width: 100%; padding: 9px 14px 9px 36px;
      background: var(--bg-card); border: 1px solid var(--border-light);
      border-radius: var(--radius-sm);
      color: var(--text-primary); font-size: 13px; font-family: inherit;
      outline: none; transition: 0.15s;
    }
    .search-wrap input:focus {
      border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-glow);
    }
    .search-wrap input::placeholder { color: var(--text-muted); }
    .search-wrap svg {
      position: absolute; left: 11px; top: 50%; transform: translateY(-50%);
      color: var(--text-muted); pointer-events: none;
    }

    /* ─── Filter Tabs ─── */
    .filter-tabs { display: flex; gap: 4px; flex-wrap: wrap; }
    .filter-tab {
      padding: 6px 14px; font-size: 12px; font-weight: 500;
      border: 1px solid transparent; border-radius: 6px;
      background: transparent; color: var(--text-muted);
      cursor: pointer; transition: 0.15s; font-family: inherit;
    }
    .filter-tab:hover { color: var(--text-secondary); background: var(--bg-hover); }
    .filter-tab.active { background: var(--primary); color: #fff; border-color: var(--primary); }

    /* ─── Toolbar ─── */
    .toolbar {
      display: flex; align-items: center; gap: 12px;
      margin-bottom: 16px; flex-wrap: wrap;
    }

    /* ─── Moderation Cards ─── */
    .mod-grid { display: grid; gap: 10px; }
    .mod-card {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: var(--radius-md); padding: 16px 18px;
      display: flex; align-items: flex-start; gap: 14px;
      transition: 0.15s;
    }
    .mod-card:hover { border-color: var(--border-light); }
    .mod-type-icon {
      width: 36px; height: 36px; border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; font-size: 15px;
    }
    .mod-body { flex: 1; min-width: 0; }
    .mod-excerpt {
      font-size: 13px; color: var(--text-secondary); line-height: 1.5;
      display: -webkit-box; -webkit-line-clamp: 2;
      -webkit-box-orient: vertical; overflow: hidden;
      margin-bottom: 8px;
    }
    .mod-meta {
      display: flex; flex-wrap: wrap; gap: 10px;
      font-size: 11px; color: var(--text-muted);
    }
    .mod-meta span { display: flex; align-items: center; gap: 4px; }
    .mod-flag { color: var(--warning); font-weight: 600; }
    .mod-actions { display: flex; gap: 6px; flex-shrink: 0; }
    .mod-empty {
      padding: 56px 20px; text-align: center;
      color: var(--text-muted); font-size: 13px;
    }

    /* ─── Verification Queue Cards ─── */
    .verify-grid { display: grid; gap: 12px; }
    .verify-card {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: var(--radius-md); padding: 18px 20px;
      display: flex; align-items: center; gap: 16px;
      transition: 0.15s;
    }
    .verify-card:hover { border-color: var(--border-light); }
    .verify-avatar {
      width: 48px; height: 48px; border-radius: 50%;
      background: var(--bg-elevated); display: flex;
      align-items: center; justify-content: center;
      font-size: 18px; font-weight: 600; color: var(--text-muted);
      flex-shrink: 0; overflow: hidden;
    }
    .verify-avatar img {
      width: 100%; height: 100%; object-fit: cover;
    }
    .verify-info { flex: 1; min-width: 0; }
    .verify-name { font-size: 14px; font-weight: 600; }
    .verify-email { font-size: 12px; color: var(--text-muted); }
    .verify-detail {
      font-size: 12px; color: var(--text-secondary); margin-top: 2px;
    }
    .verify-actions { display: flex; gap: 8px; flex-shrink: 0; }

    /* ─── Content List ─── */
    .content-list { display: flex; flex-direction: column; }
    .content-item {
      display: flex; align-items: center; gap: 14px;
      padding: 14px 0;
      border-bottom: 1px solid var(--border);
    }
    .content-item:last-child { border-bottom: none; }
    .content-thumb {
      width: 44px; height: 44px; border-radius: 8px;
      background: var(--bg-elevated); display: flex;
      align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .content-detail { flex: 1; min-width: 0; }
    .content-title {
      font-size: 13px; font-weight: 500; color: var(--text-primary);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .content-sub { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
    .content-actions { display: flex; gap: 6px; flex-shrink: 0; }

    /* ─── Modal ─── */
    .modal-overlay {
      position: fixed; inset: 0; z-index: 1000;
      background: rgba(0,0,0,0.7); backdrop-filter: blur(4px);
      display: flex; align-items: center; justify-content: center;
      padding: 20px;
      opacity: 0; pointer-events: none; transition: opacity 0.2s;
    }
    .modal-overlay.open { opacity: 1; pointer-events: auto; }
    .modal {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      max-width: 820px; width: 100%; max-height: 90vh;
      display: flex; flex-direction: column;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);

      cursor: pointer; transition: 0.15s;

      display: grid; grid-template-columns: 1fr 1fr;
      gap: 0; overflow: hidden; flex: 1; min-height: 0;
    }

      transform-origin: center center; transition: none;
      user-select: none; -webkit-user-drag: none;
    }

      position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%);

    }

      width: 56px; height: 56px; border-radius: 50%;

    .user-detail-actions {
      display: flex; gap: 8px; flex-wrap: wrap;
      margin-top: auto; padding-top: 14px;
      border-top: 1px solid var(--border);
    }

    /* ─── Toast ─── */
    .toast-container {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      z-index: 2000; display: flex; flex-direction: column; gap: 8px;
      align-items: center; pointer-events: none;
    }
    .toast {
      background: var(--bg-elevated); border: 1px solid var(--border-light);
      color: var(--text-primary); padding: 10px 20px;
      border-radius: var(--radius-md); font-size: 13px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.4);
      opacity: 0; transform: translateY(10px);
      transition: all 0.25s; pointer-events: auto;
    }
    .toast.show { opacity: 1; transform: translateY(0); }

    /* ─── Loading ─── */
    .loading-wrap {
      padding: 80px 0; text-align: center; color: var(--text-muted); font-size: 13px;
    }
    .spinner {
      width: 28px; height: 28px; border: 3px solid var(--border-light);
      border-top-color: var(--primary); border-radius: 50%;
      animation: spin 0.7s linear infinite; margin: 0 auto 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ─── Confirm Dialog ─── */
    .confirm-dialog {
      max-width: 400px; width: 100%; padding: 24px;
    }
    .confirm-dialog h3 { font-size: 16px; margin-bottom: 10px; }
    .confirm-dialog p { font-size: 13px; color: var(--text-secondary); margin-bottom: 20px; line-height: 1.5; }
    .confirm-actions { display: flex; gap: 10px; justify-content: flex-end; }

    /* ─── Sidebar overlay (mobile) ─── */
    .sidebar-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.5); z-index: 199;
    }
    .sidebar-overlay.active { display: block; }

    /* ─── Responsive ─── */
    @media (max-width: 1024px) {
      .stat-grid { grid-template-columns: repeat(2, 1fr); }
      .action-grid { grid-template-columns: repeat(2, 1fr); }
    }

      .action-grid { grid-template-columns: 1fr; }
      .page { padding: 16px; }
      .main-topbar { padding: 0 16px; }
      .modal-body { grid-template-columns: 1fr; }
      .modal-image-wrap {

      }
      .toolbar { flex-direction: column; align-items: stretch; }
      .verify-card { flex-direction: column; align-items: flex-start; }
      .verify-actions { width: 100%; }
      .verify-actions .btn { flex: 1; }
      .mod-card { flex-direction: column; }
      .mod-actions { align-self: flex-end; }
      table.data-table { font-size: 12px; }
      table.data-table th, table.data-table td { padding: 8px 10px; }
    }
    @media (max-width: 480px) {
      .stat-grid { grid-template-columns: 1fr; }

        method: 'POST',
        headers: { 'Content-Type': 'application/json', apikey: SUPABASE_ANON_KEY },
        body: JSON.stringify({ email, password }),
      });
      if (!res.ok) { const b = await res.text(); throw new Error(b || 'Login failed'); }
      return res.json();
    }

      });
      if (!res.ok) return null;
      const p = await res.json();
      return p[0] || null;

              <div class="modal-header">
                <h3>User Details</h3>
                <button class="modal-close" id="detail-close">${I.x}</button>
              </div>
              <div style="padding:24px;overflow-y:auto">${renderUserDetail()}</div>

                <button class="btn btn-ghost btn-sm" id="confirm-cancel">Cancel</button>

    function viewTitle(id) {
      const m = {
        dashboard: 'Dashboard',
        users: 'User Management',
        verification: 'Verification Queue',
        reports: 'Reports',
        content: 'Posts & Content',
        events: 'Events',
        marketplace: 'Marketplace',
        settings: 'Settings',
      };
      return m[id] || 'Dashboard';
    }

    function pageContent(id) {
      const fn = {
        dashboard: pageDashboard,
        users: pageUsers,
        verification: pageVerification,
        reports: pageReports,
        content: pageContentMgmt,
        events: pageEvents,
        marketplace: pageMarketplace,
        settings: pageSettings,
      };
      return (fn[id] || pageDashboard)();
    }

    /* ─── Dashboard Page ───────────────────────────── */
    function pageDashboard() {
      const d = state.dashboard;
      const a = d?.analytics || {};
      const users = d?.users || [];
      const reports = d?.reports || [];
      const totalUsers = a.totalUsers ?? 0;
      const pending = a.pendingVerifications ?? 0;
      const engagement = a.dailyEngagement ?? 0;
      const totalReports = a.totalReports ?? 0;
      const verifiedCount = users.filter(u => u.verification_status === 'approved').length;
      const verifyRate = totalUsers > 0 ? Math.round((verifiedCount / totalUsers) * 100) : 0;

      const recentUsers = [...users].sort((a, b) => new Date(b.created_at) - new Date(a.created_at)).slice(0, 5);
      const recentReports = reports.slice(0, 5);
      const activity = [
        ...recentUsers.map(u => ({ type: 'join', text: `<strong>${esc(u.name)}</strong> joined CampusVibe`, time: u.created_at })),
        ...recentReports.map(r => ({ type: 'flag', text: `<strong>${esc(r.content_type)}</strong> flagged — "${esc(r.reason || 'No reason')}"`, time: r.created_at })),
      ].sort((a, b) => new Date(b.time) - new Date(a.time)).slice(0, 8);

      return `
        <!-- Welcome -->
        <div style="margin-bottom:28px;">
          <div style="font-size:22px;font-weight:700;letter-spacing:-0.3px;">Welcome back</div>
          <div style="font-size:13px;color:var(--text-muted);margin-top:4px;">
            ${esc(state.user?.email || 'Admin')} · ${new Date().toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' })}
          </div>
        </div>

        <!-- Stats -->
        <div class="stat-grid">
          <div class="stat-card" onclick="navigateTo('users')" style="cursor:pointer">
            <div class="stat-top">
              <span class="stat-icon icon-purple">${I.users}</span>
            </div>
            <div class="stat-value">${totalUsers.toLocaleString()}</div>
            <div class="stat-label">Total Users</div>
          </div>
          <div class="stat-card" onclick="navigateTo('verification')" style="cursor:pointer">
            <div class="stat-top">
              <span class="stat-icon icon-orange">${I.userCheck}</span>
            </div>
            <div class="stat-value">${pending}</div>
            <div class="stat-label">Pending Verification</div>
            ${pending > 0 ? `<span class="stat-trend warn">Needs review</span>` : `<span class="stat-trend up">All clear</span>`}
          </div>
          <div class="stat-card">
            <div class="stat-top">
              <span class="stat-icon icon-green">${I.post}</span>
            </div>
            <div class="stat-value">${engagement.toLocaleString()}</div>
            <div class="stat-label">Posts + Messages Today</div>
          </div>
          <div class="stat-card" onclick="navigateTo('reports')" style="cursor:pointer">
            <div class="stat-top">
              <span class="stat-icon icon-red">${I.flag}</span>
            </div>
            <div class="stat-value">${totalReports}</div>
            <div class="stat-label">Active Reports</div>
            ${totalReports > 0 ? `<span class="stat-trend warn">${totalReports} pending</span>` : `<span class="stat-trend up">No flags</span>`}
          </div>
          <div class="stat-card">
            <div class="stat-top">
              <span class="stat-icon icon-blue">${I.shield}</span>
            </div>
            <div class="stat-value">${verifyRate}%</div>
            <div class="stat-label">Verification Rate</div>
          </div>
          <div class="stat-card">
            <div class="stat-top">
              <span class="stat-icon icon-purple">${I.store}</span>
            </div>
            <div class="stat-value">${users.length}</div>
            <div class="stat-label">Community Size</div>
          </div>
        </div>

        <!-- Quick Actions -->
        <div class="section-title">Quick Actions</div>
        <div class="action-grid">
          <div class="action-card" onclick="navigateTo('users')">
            <div class="action-icon icon-purple">${I.users}</div>
            <div>
              <div class="action-title">Manage Users</div>
              <div class="action-desc">View, search, and moderate user accounts</div>
            </div>
          </div>
          <div class="action-card" onclick="navigateTo('verification')">
            <div class="action-icon icon-orange">${I.userCheck}</div>
            <div>
              <div class="action-title">Review Verifications</div>
              <div class="action-desc">Approve or reject student ID submissions</div>
            </div>
          </div>
          <div class="action-card" onclick="navigateTo('reports')">
            <div class="action-icon icon-red">${I.flag}</div>
            <div>
              <div class="action-title">Moderate Reports</div>
              <div class="action-desc">Review flagged content and take action</div>
            </div>
          </div>
          <div class="action-card" onclick="navigateTo('content')">
            <div class="action-icon icon-green">${I.post}</div>
            <div>
              <div class="action-title">Manage Content</div>
              <div class="action-desc">Browse and moderate posts across the platform</div>
            </div>
          </div>
          <div class="action-card" onclick="navigateTo('events')">
            <div class="action-icon icon-blue">${I.calendar}</div>
            <div>
              <div class="action-title">Events</div>
              <div class="action-desc">View upcoming campus events</div>
            </div>
          </div>
          <div class="action-card" onclick="navigateTo('marketplace')">
            <div class="action-icon icon-green">${I.store}</div>
            <div>
              <div class="action-title">Marketplace</div>
              <div class="action-desc">Review listings and seller activity</div>
            </div>
          </div>
        </div>

        <!-- Activity -->
        <div class="card">
          <div class="card-header">
            <h2>Recent Activity</h2>
          </div>
          <div class="card-pad">
            ${activity.length === 0
              ? '<div style="padding:24px 0;text-align:center;color:var(--text-muted);font-size:13px;">No recent activity</div>'
              : `<div class="activity-list">
                  ${activity.map(a => `
                    <div class="activity-item">
                      <span class="activity-dot ${a.type}"></span>
                      <span class="activity-text">${a.text}</span>
                      <span class="activity-time">${formatDate(a.time)}</span>
                    </div>
                  `).join('')}
                </div>`
            }
          </div>
        </div>`;
    }

    /* ─── Users Page ───────────────────────────────── */
    function pageUsers() {
      const users = state.dashboard?.users || [];
      const q = state.userSearch.toLowerCase();
      let filtered = users;
      if (state.filterTab === 'verified') filtered = filtered.filter(u => u.verification_status === 'approved');
      else if (state.filterTab === 'pending') filtered = filtered.filter(u => !u.verification_status || u.verification_status === 'pending');
      else if (state.filterTab === 'rejected') filtered = filtered.filter(u => u.verification_status === 'rejected');
      if (q) filtered = filtered.filter(u =>
        (u.name || '').toLowerCase().includes(q) ||
        (u.email || '').toLowerCase().includes(q) ||
        (u.department || '').toLowerCase().includes(q)
      );

      return `
        <div class="toolbar">
          <div class="search-wrap">
            ${I.search}
            <input type="text" id="user-search" placeholder="Search by name, email, or department…" value="${esc(state.userSearch)}" />
          </div>
          <div class="filter-tabs">
            ${['all','verified','pending','rejected'].map(t => `
              <button class="filter-tab ${state.filterTab === t ? 'active' : ''}" data-filter="${t}">
                ${t === 'all' ? 'All' : t.charAt(0).toUpperCase() + t.slice(1)}
              </button>
            `).join('')}
          </div>
        </div>
        <div class="card">
          <div class="card-header">
            <h2>Users</h2>
            <span class="count-badge badge badge-approved">${filtered.length}</span>
          </div>
          <div class="table-wrap">
            ${filtered.length === 0
              ? `<div class="table-empty">${I.empty}<br>${q ? 'No users match your search' : 'No users found'}</div>`
              : `<table class="data-table">
                  <thead><tr>
                    <th>Name</th><th>Department</th><th>Year</th>
                    <th>Verification</th><th>Joined</th><th>Actions</th>
                  </tr></thead>
                  <tbody>
                    ${filtered.map(u => `<tr>
                      <td>
                        <div class="user-name-cell">${esc(u.name)}</div>
                        <div class="user-email-cell">${esc(u.email)}</div>
                      </td>
                      <td>${esc(u.department || '—')}</td>
                      <td>${formatYear(u.year)}</td>
                      <td>${statusBadge(u.verification_status)}</td>
                      <td style="white-space:nowrap">${formatDate(u.created_at)}</td>
                      <td>
                        <div style="display:flex;gap:6px;">
                          <button class="btn btn-xs btn-ghost user-detail-btn" data-user-id="${u.id}">Profile</button>
                          ${(!u.verification_status || u.verification_status === 'pending')
                            ? `<button class="btn btn-xs btn-outline review-btn" data-user-id="${u.id}">Review ID</button>`
                            : ''
                          }
                        </div>
                      </td>
                    </tr>`).join('')}
                  </tbody>
                </table>`
            }
          </div>
        </div>`;
    }

    /* ─── Verification Page ────────────────────────── */
    function pageVerification() {
      const users = state.dashboard?.users || [];
      const pending = users.filter(u => !u.verification_status || u.verification_status === 'pending');

      if (pending.length === 0) {
        return `
          <div class="card">
            <div class="card-pad">
              <div class="mod-empty">
                <div style="margin-bottom:12px;">${I.empty}</div>
                All caught up! No pending verifications.
              </div>
            </div>
          </div>`;
      }

      return `
        <div style="margin-bottom:16px;font-size:13px;color:var(--text-secondary);">
          ${pending.length} student${pending.length !== 1 ? 's' : ''} awaiting document review
        </div>
        <div class="verify-grid">
          ${pending.map(u => `
            <div class="verify-card">
              <div class="verify-avatar">${(u.name || '?').charAt(0).toUpperCase()}</div>
              <div class="verify-info">
                <div class="verify-name">${esc(u.name)}</div>
                <div class="verify-email">${esc(u.email)}</div>
                <div class="verify-detail">${esc(u.department || '—')} · ${formatYear(u.year)} · ${formatDocType(u.student_document_type)}</div>
              </div>
              <div class="verify-actions">
                <button class="btn btn-sm btn-ghost review-btn" data-user-id="${u.id}">Review</button>
                <button class="btn btn-sm btn-success verify-approve-btn" data-user-id="${u.id}" data-email="${esc(u.email)}" data-name="${esc(u.name)}" ${state.actionLoading['approve_'+u.id] ? 'disabled' : ''}>
                  ${state.actionLoading['approve_'+u.id] ? '…' : 'Approve'}
                </button>
                <button class="btn btn-sm btn-danger-ghost verify-reject-btn" data-user-id="${u.id}" data-email="${esc(u.email)}" data-name="${esc(u.name)}" ${state.actionLoading['reject_'+u.id] ? 'disabled' : ''}>
                  ${state.actionLoading['reject_'+u.id] ? '…' : 'Reject'}
                </button>
              </div>
            </div>
          `).join('')}
        </div>`;
    }

    /* ─── Reports Page ─────────────────────────────── */
    function pageReports() {
      const reports = state.dashboard?.reports || [];
      const q = state.reportSearch.toLowerCase();
      let filtered = reports;
      if (state.reportFilterTab !== 'all') {
        filtered = filtered.filter(r => r.content_type === state.reportFilterTab);
      }
      if (q) filtered = filtered.filter(r =>
        (r.content_excerpt || '').toLowerCase().includes(q) ||
        (r.author_name || '').toLowerCase().includes(q) ||
        (r.reason || '').toLowerCase().includes(q)
      );

      return `
        <div class="toolbar">
          <div class="search-wrap">
            ${I.search}
            <input type="text" id="report-search" placeholder="Search reports…" value="${esc(state.reportSearch)}" />
          </div>
          <div class="filter-tabs">
            ${['all','post','confession','listing'].map(t => `
              <button class="filter-tab ${state.reportFilterTab === t ? 'active' : ''}" data-report-filter="${t}">
                ${t === 'all' ? 'All' : t.charAt(0).toUpperCase() + t.slice(1)}
              </button>
            `).join('')}
          </div>
        </div>
        <div class="card">
          <div class="card-header">
            <h2>Reported Content</h2>
            <span class="count-badge badge badge-pending">${filtered.length} flag${filtered.length !== 1 ? 's' : ''}</span>
          </div>
          <div class="card-pad">
            ${filtered.length === 0
              ? `<div class="mod-empty"><div style="margin-bottom:12px;">${I.empty}</div>${q ? 'No reports match your search' : 'No reported content. All clear!'}</div>`
              : `<div class="mod-grid">
                  ${filtered.map(r => `
                    <div class="mod-card">
                      <div class="mod-type-icon" style="background:${typeColor(r.content_type).bg};color:${typeColor(r.content_type).fg}">
                        ${typeIcon(r.content_type)}
                      </div>
                      <div class="mod-body">
                        <div class="mod-excerpt">${esc(r.content_excerpt || '[deleted]')}</div>
                        <div class="mod-meta">
                          <span>${typeLabel(r.content_type)}</span>
                          <span class="mod-flag">${r.flag_count} flag${r.flag_count !== 1 ? 's' : ''}</span>
                          <span>${esc(r.author_name || 'Unknown')}</span>
                          <span>${formatDate(r.created_at)}</span>
                          ${r.reason ? `<span>"${esc(r.reason)}"</span>` : ''}
                        </div>
                      </div>
                      <div class="mod-actions">
                        <button class="btn btn-xs btn-ghost dismiss-btn" data-report-id="${r.id}" ${state.actionLoading['dismiss_'+r.id] ? 'disabled' : ''}>
                          ${state.actionLoading['dismiss_'+r.id] ? '…' : 'Dismiss'}
                        </button>
                        <button class="btn btn-xs btn-danger-ghost remove-btn" data-report-id="${r.id}" ${state.actionLoading['remove_'+r.id] ? 'disabled' : ''}>
                          ${state.actionLoading['remove_'+r.id] ? '…' : 'Remove'}
                        </button>
                      </div>
                    </div>
                  `).join('')}
                </div>`
            }
          </div>
        </div>`;
    }

    /* ─── Content Management ───────────────────────── */
    function pageContentMgmt() {
      const reports = state.dashboard?.reports || [];
      const postReports = reports.filter(r => r.content_type === 'post');
      const users = state.dashboard?.users || [];
      const totalUsers = users.length;

      return `
        <div class="stat-grid" style="grid-template-columns:repeat(3,1fr);margin-bottom:24px;">
          <div class="stat-card">
            <div class="stat-top"><span class="stat-icon icon-purple">${I.post}</span></div>
            <div class="stat-value">${totalUsers}</div>
            <div class="stat-label">Total Users (proxy for content scale)</div>
          </div>
          <div class="stat-card">
            <div class="stat-top"><span class="stat-icon icon-orange">${I.flag}</span></div>
            <div class="stat-value">${postReports.length}</div>
            <div class="stat-label">Reported Posts</div>
          </div>
          <div class="stat-card">
            <div class="stat-top"><span class="stat-icon icon-green">${I.eye}</span></div>
            <div class="stat-value">${(state.dashboard?.analytics?.dailyEngagement ?? 0)}</div>
            <div class="stat-label">Today's Activity</div>
          </div>
        </div>
        <div class="section-title">Reported Posts</div>
        <div class="card">
          <div class="card-header">
            <h2>Flagged Posts</h2>
            <span class="count-badge badge badge-confession">${postReports.length}</span>
          </div>
          <div class="card-pad">
            ${postReports.length === 0
              ? `<div class="mod-empty"><div style="margin-bottom:12px;">${I.empty}</div>No reported posts</div>`
              : `<div class="content-list">
                  ${postReports.map(r => `
                    <div class="content-item">
                      <div class="content-thumb" style="background:var(--primary-subtle);color:var(--primary)">${I.post}</div>
                      <div class="content-detail">
                        <div class="content-title">${esc(r.content_excerpt || '[deleted]')}</div>
                        <div class="content-sub">${esc(r.author_name || 'Unknown')} · ${r.flag_count} flags · ${formatDate(r.created_at)}</div>
                      </div>
                      <div class="content-actions">
                        <button class="btn btn-xs btn-ghost dismiss-btn" data-report-id="${r.id}" ${state.actionLoading['dismiss_'+r.id] ? 'disabled' : ''}>Dismiss</button>
                        <button class="btn btn-xs btn-danger-ghost remove-btn" data-report-id="${r.id}" ${state.actionLoading['remove_'+r.id] ? 'disabled' : ''}>Remove</button>
                      </div>
                    </div>

                </div>`

    /* ─── Events Page ──────────────────────────────── */
    function pageEvents() {
      return `
        <div class="card">
          <div class="card-header"><h2>Campus Events</h2></div>
          <div class="card-pad">
            <div class="mod-empty">
              <div style="margin-bottom:12px;">${I.calendar}</div>
              <div style="font-size:14px;font-weight:600;color:var(--text-primary);margin-bottom:4px;">Events Management</div>
              <div style="font-size:13px;">Event management is available in the CampusVibe mobile app. Events are created by verified students and appear in the unified feed.</div>
            </div>
          </div>
        </div>`;

    /* ─── Marketplace Page ─────────────────────────── */
    function pageMarketplace() {
      const reports = state.dashboard?.reports || [];
      const listingReports = reports.filter(r => r.content_type === 'listing');

      return `
        <div class="card">
          <div class="card-header">
            <h2>Marketplace Listings</h2>
            <span class="count-badge badge badge-listing">${listingReports.length} flagged</span>
          </div>
          <div class="card-pad">
            ${listingReports.length === 0
              ? `<div class="mod-empty">
                  <div style="margin-bottom:12px;">${I.store}</div>
                  <div style="font-size:14px;font-weight:600;color:var(--text-primary);margin-bottom:4px;">No Flagged Listings</div>
                  <div style="font-size:13px;">All marketplace listings are clean. Reported listings will appear here for moderation.</div>
                </div>`
              : `<div class="content-list">
                  ${listingReports.map(r => `
                    <div class="content-item">
                      <div class="content-thumb" style="background:var(--success-subtle);color:var(--success)">${I.store}</div>
                      <div class="content-detail">
                        <div class="content-title">${esc(r.content_excerpt || '[deleted]')}</div>
                        <div class="content-sub">${esc(r.author_name || 'Unknown')} · ${r.flag_count} flags · ${formatDate(r.created_at)}</div>
                      </div>
                      <div class="content-actions">
                        <button class="btn btn-xs btn-ghost dismiss-btn" data-report-id="${r.id}">Dismiss</button>
                        <button class="btn btn-xs btn-danger-ghost remove-btn" data-report-id="${r.id}">Remove</button>
                      </div>
                    </div>
                  `).join('')}
                </div>`
            }
          </div>
        </div>`;
    }

    /* ─── Settings Page ────────────────────────────── */
    function pageSettings() {
      const sections = [
        { icon: I.shield, title: 'Moderation', desc: 'Content filtering, auto-mod rules, and report thresholds', color: 'icon-purple' },
        { icon: I.bell, title: 'Notifications', desc: 'Email templates, push notification settings, and alert preferences', color: 'icon-orange' },
        { icon: I.users, title: 'Roles & Permissions', desc: 'Admin roles, moderator permissions, and access control', color: 'icon-blue' },
        { icon: I.lock, title: 'Security', desc: 'Authentication settings, session management, and API keys', color: 'icon-red' },
        { icon: I.settings, title: 'General', desc: 'App name, university settings, branding, and display options', color: 'icon-green' },
      ];

      return `
        <div class="section-title">System Configuration</div>
        <div style="display:grid;gap:10px;">
          ${sections.map(s => `
            <div class="card" style="cursor:default;">
              <div style="padding:18px 20px;display:flex;align-items:center;gap:14px;">
                <div class="stat-icon ${s.color}" style="width:40px;height:40px;border-radius:10px;">${s.icon}</div>
                <div style="flex:1;">
                  <div style="font-size:14px;font-weight:600;">${s.title}</div>
                  <div style="font-size:12px;color:var(--text-muted);margin-top:2px;">${s.desc}</div>
                </div>
                <span style="font-size:11px;color:var(--text-muted);padding:4px 10px;border:1px solid var(--border-light);border-radius:6px;">Coming soon</span>
              </div>
            </div>
          `).join('')}
        </div>`;

    /* ─── Verification Modal Content ───────────────── */
    function renderModalContent() {
      const userId = state.selectedUserId;
      if (!userId) return '';
      const user = (state.dashboard?.users || []).find(u => u.id === userId);
      if (!user) return '<div style="padding:40px;text-align:center;color:var(--text-muted);">User not found.</div>';
      const hasPhoto = user.student_id_photo;

      return `
        <div class="modal-image-wrap" id="modal-image-wrap">
          ${hasPhoto
            ? `<img id="modal-img" src="${user.student_id_photo}" alt="Verification document" draggable="false"
                   style="transform:translate(${state.panX}px,${state.panY}px) scale(${state.zoomLevel})" />
                 <div class="zoom-hint">Scroll to zoom · Drag to pan · Double-click to reset</div>`
            : `<div class="no-photo">No verification document uploaded</div>`
          }
        </div>
        <div class="modal-info">
          <div>
            <div class="info-name">${esc(user.name)}</div>
            <div class="info-email">${esc(user.email)}</div>
          </div>
          <div class="info-grid">
            <div class="info-field"><div class="label">Department</div><div class="value">${esc(user.department || '—')}</div></div>
            <div class="info-field"><div class="label">Academic Year</div><div class="value">${formatYear(user.year)}</div></div>
            <div class="info-field"><div class="label">Document Type</div><div class="value">${esc(formatDocType(user.student_document_type))}</div></div>
            <div class="info-field"><div class="label">Signed Up</div><div class="value">${formatDate(user.created_at)}</div></div>
            <div class="info-field"><div class="label">Status</div><div class="value">${statusBadge(user.verification_status)}</div></div>
          </div>
          <div class="info-actions">
            <button class="btn btn-success modal-action-btn" data-action="approve" data-user-id="${user.id}" data-email="${esc(user.email)}" data-name="${esc(user.name)}" ${state.actionLoading['approve_'+user.id] ? 'disabled' : ''}>
              ${state.actionLoading['approve_'+user.id] ? 'Processing…' : 'Approve'}
            </button>
            <button class="btn btn-danger modal-action-btn" data-action="reject" data-user-id="${user.id}" data-email="${esc(user.email)}" data-name="${esc(user.name)}" ${state.actionLoading['reject_'+user.id] ? 'disabled' : ''}>
              ${state.actionLoading['reject_'+user.id] ? 'Processing…' : 'Reject'}
            </button>
          </div>
        </div>`;
    }

    /* ─── User Detail Modal ────────────────────────── */
    function renderUserDetail() {
      const userId = state.detailUserId;
      if (!userId) return '';
      const user = (state.dashboard?.users || []).find(u => u.id === userId);
      if (!user) return '<div style="text-align:center;color:var(--text-muted);padding:40px;">User not found.</div>';
      const initial = (user.name || '?').charAt(0).toUpperCase();

      return `
        <div class="user-detail-header">
          <div class="user-detail-avatar">${initial}</div>
          <div>
            <div class="info-name">${esc(user.name)}</div>
            <div class="info-email">${esc(user.email)}</div>
            <div style="margin-top:4px">${statusBadge(user.verification_status)}</div>
          </div>
        </div>
        <div class="user-detail-meta" style="margin-top:16px;">
          <div class="info-field"><div class="label">Department</div><div class="value">${esc(user.department || '—')}</div></div>
          <div class="info-field"><div class="label">Academic Year</div><div class="value">${formatYear(user.year)}</div></div>
          <div class="info-field"><div class="label">Joined</div><div class="value">${formatDate(user.created_at)}</div></div>
          <div class="info-field"><div class="label">Role</div><div class="value">${user.is_admin ? '<span style="color:var(--primary)">Admin</span>' : 'Member'}</div></div>
          <div class="info-field"><div class="label">Document Type</div><div class="value">${esc(formatDocType(user.student_document_type))}</div></div>
          <div class="info-field"><div class="label">Status</div><div class="value">${user.banned ? '<span style="color:var(--danger)">Banned</span>' : 'Active'}</div></div>
        </div>
        <div class="user-detail-actions">
          ${(!user.verification_status || user.verification_status === 'pending')
            ? `<button class="btn btn-sm btn-primary user-detail-review" data-user-id="${user.id}">Review ID</button>`
            : ''
          }
          <button class="btn btn-sm btn-ghost" onclick="closeDetailModal()">Close</button>
        </div>`;
    }

    /* ─── Layout Events ────────────────────────────── */
    function bindLayoutEvents() {
      document.getElementById('logout-btn')?.addEventListener('click', handleLogout);
      document.getElementById('refresh-btn')?.addEventListener('click', fetchDashboard);
      document.getElementById('mobile-menu-btn')?.addEventListener('click', () => {
        state.sidebarOpen = !state.sidebarOpen;
        render();
      });
      document.getElementById('sidebar-overlay')?.addEventListener('click', () => {
        state.sidebarOpen = false;
        render();
      });

      // Sidebar navigation
      document.querySelectorAll('.nav-item[data-view]').forEach(el => {
        el.addEventListener('click', () => {
          state.currentView = el.dataset.view;
          state.sidebarOpen = false;
          render();
          // Scroll to top
          document.querySelector('.main-scroll')?.scrollTo(0, 0);
        });
      });
    }

    /* ─── Page-specific Events ─────────────────────── */
    function bindPageEvents() {
      const v = state.currentView;

      // User search
      const us = document.getElementById('user-search');
      if (us) us.addEventListener('input', e => { state.userSearch = e.target.value; render(); });
      // Report search
      const rs = document.getElementById('report-search');
      if (rs) rs.addEventListener('input', e => { state.reportSearch = e.target.value; render(); });

      // Filter tabs
      document.querySelectorAll('.filter-tab[data-filter]').forEach(el => {
        el.addEventListener('click', () => { state.filterTab = el.dataset.filter; render(); });
      });
      document.querySelectorAll('.filter-tab[data-report-filter]').forEach(el => {
        el.addEventListener('click', () => { state.reportFilterTab = el.dataset.reportFilter; render(); });
      });

      // Review buttons (open verification modal)
      document.querySelectorAll('.review-btn').forEach(el => {
        el.addEventListener('click', () => {
          state.selectedUserId = el.dataset.userId;
          resetZoom();
          render();
          bindModalEvents();
        });
      });

      // User detail buttons
      document.querySelectorAll('.user-detail-btn').forEach(el => {
        el.addEventListener('click', () => {
          state.detailUserId = el.dataset.userId;
          render();
          bindDetailModalEvents();
        });
      });

      // User detail review button
      document.querySelectorAll('.user-detail-review').forEach(el => {
        el.addEventListener('click', () => {
          state.detailUserId = null;
          state.selectedUserId = el.dataset.userId;
          resetZoom();
          render();
          bindModalEvents();
        });
      });

      // Verify approve/reject (from verification page cards)
      document.querySelectorAll('.verify-approve-btn').forEach(el => {
        el.addEventListener('click', () => handleVerification('approve', el.dataset.userId, el.dataset.email, el.dataset.name));
      });
      document.querySelectorAll('.verify-reject-btn').forEach(el => {
        el.addEventListener('click', () => handleVerification('reject', el.dataset.userId, el.dataset.email, el.dataset.name));
      });

      // Dismiss reports
      document.querySelectorAll('.dismiss-btn').forEach(el => {
        el.addEventListener('click', () => {
          state.confirmAction = {
            title: 'Dismiss Report',
            message: 'This will dismiss all flags for this content. The content will remain published.',
            confirmText: 'Dismiss',
            danger: false,
            onConfirm: () => handleModeration('dismiss_report', el.dataset.reportId),
          };
          render();
          bindConfirmEvents();
        });
      });

      // Remove content
      document.querySelectorAll('.remove-btn').forEach(el => {
        el.addEventListener('click', () => {
          state.confirmAction = {
            title: 'Remove Content',
            message: 'This will permanently delete the content and all associated reports. This cannot be undone.',
            confirmText: 'Remove',
            danger: true,
            onConfirm: () => handleModeration('remove_content', el.dataset.reportId),
          };
          render();
          bindConfirmEvents();
        });
      });

      // ESC to close modals
      document.addEventListener('keydown', escHandler);
    }

    function bindModalEvents() {
      document.getElementById('modal-close')?.addEventListener('click', closeModal);
      document.getElementById('verify-modal')?.addEventListener('click', e => {
        if (e.target.id === 'verify-modal') closeModal();
      });
      document.querySelectorAll('.modal-action-btn').forEach(el => {
        el.addEventListener('click', () => {
          handleVerification(el.dataset.action, el.dataset.userId, el.dataset.email, el.dataset.name);
        });
      });
      // Zoom/pan
      const wrap = document.getElementById('modal-image-wrap');
      const img = document.getElementById('modal-img');
      if (wrap && img) {
        wrap.addEventListener('wheel', e => {
          e.preventDefault();
          state.zoomLevel = Math.max(0.5, Math.min(5, state.zoomLevel + (e.deltaY > 0 ? -0.1 : 0.1)));
          applyZoom();
        }, { passive: false });
        wrap.addEventListener('mousedown', e => {
          if (e.target === img) {
            state.isDragging = true;
            state.dragStartX = e.clientX - state.panX;
            state.dragStartY = e.clientY - state.panY;
          }
        });
        window.addEventListener('mousemove', e => {
          if (!state.isDragging) return;
          state.panX = e.clientX - state.dragStartX;
          state.panY = e.clientY - state.dragStartY;
          applyZoom();
        });
        window.addEventListener('mouseup', () => { state.isDragging = false; });
        wrap.addEventListener('dblclick', () => { resetZoom(); applyZoom(); });
      }
    }

    function bindDetailModalEvents() {
      document.getElementById('detail-close')?.addEventListener('click', closeDetailModal);
      document.getElementById('detail-modal')?.addEventListener('click', e => {
        if (e.target.id === 'detail-modal') closeDetailModal();
      });
    }

    function bindConfirmEvents() {
      document.getElementById('confirm-cancel')?.addEventListener('click', () => {
        state.confirmAction = null;
        render();
        bindPageEvents();
      });
      document.getElementById('confirm-ok')?.addEventListener('click', () => {
        const action = state.confirmAction?.onConfirm;
        state.confirmAction = null;
        if (action) action();
      });
    }

    function escHandler(e) {
      if (e.key === 'Escape') {
        if (state.confirmAction) { state.confirmAction = null; render(); bindPageEvents(); }
        else if (state.selectedUserId) closeModal();
        else if (state.detailUserId) closeDetailModal();
      }
    }

    function applyZoom() {
      const img = document.getElementById('modal-img');
      if (img) img.style.transform = `translate(${state.panX}px,${state.panY}px) scale(${state.zoomLevel})`;
    }
    function resetZoom() { state.zoomLevel = 1; state.panX = 0; state.panY = 0; }
    function closeModal() { state.selectedUserId = null; resetZoom(); render(); bindPageEvents(); }
    function closeDetailModal() { state.detailUserId = null; render(); bindPageEvents(); }

    // Expose for onclick handlers
    window.navigateTo = function(view) {
      state.currentView = view;
      state.sidebarOpen = false;
      render();
      document.querySelector('.main-scroll')?.scrollTo(0, 0);
    };
    window.closeDetailModal = function() { state.detailUserId = null; render(); bindPageEvents(); };

    /* ─── API ──────────────────────────────────────── */
    async function fetchDashboard() {
      state.loading = true;
      render();
      try {
        const res = await fetch(EDGE_FN_URL + '?scope=dashboard', {
          headers: { Authorization: 'Bearer ' + state.accessToken },
        });
        if (res.status === 401 || res.status === 403) {
          showToast('Session expired. Please log in again.');
          handleLogout();
          return;
        }
        if (!res.ok) throw new Error(await res.text() || 'Failed to fetch dashboard data');
        state.dashboard = await res.json();
      } catch (e) {
        showToast('Error: ' + e.message);
      } finally {
        state.loading = false;
        render();
      }
    }

    async function handleVerification(action, userId, email, name) {
      state.actionLoading[action + '_' + userId] = true;
      render();
      try {
        const res = await fetch(EDGE_FN_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + state.accessToken },
          body: JSON.stringify({ action, user_id: userId, email, name }),
        });
        if (res.status === 401 || res.status === 403) { showToast('Session expired.'); handleLogout(); return; }
        if (!res.ok) throw new Error(await res.text() || 'Action failed');
        const users = state.dashboard?.users || [];
        const idx = users.findIndex(u => u.id === userId);
        if (idx !== -1) users[idx].verification_status = action === 'approve' ? 'approved' : 'rejected';
        state.dashboard.analytics.pendingVerifications = Math.max(0, (state.dashboard.analytics.pendingVerifications || 1) - 1);
        state.selectedUserId = null;
        resetZoom();
        showToast(name + ' ' + (action === 'approve' ? 'approved' : 'rejected'));
      } catch (e) {
        showToast('Error: ' + e.message);
      } finally {
        delete state.actionLoading[action + '_' + userId];
        render();
      }
    }

    async function handleModeration(action, reportId) {
      const key = action === 'dismiss_report' ? 'dismiss_' + reportId : 'remove_' + reportId;
      state.actionLoading[key] = true;
      render();
      try {
        const res = await fetch(EDGE_FN_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + state.accessToken },
          body: JSON.stringify({ action, report_id: reportId }),
        });
        if (res.status === 401 || res.status === 403) { showToast('Session expired.'); handleLogout(); return; }
        if (!res.ok) throw new Error(await res.text() || 'Action failed');
        state.dashboard.reports = (state.dashboard?.reports || []).filter(r => r.id !== reportId);
        state.dashboard.analytics.totalReports = Math.max(0, (state.dashboard.analytics.totalReports || 1) - 1);
        showToast(action === 'dismiss_report' ? 'Report dismissed' : 'Content removed');
      } catch (e) {
        showToast('Error: ' + e.message);
      } finally {
        delete state.actionLoading[key];
        render();
      }
    }

    /* ─── Auth ─────────────────────────────────────── */
    async function handleLogin() {
      const emailEl = document.getElementById('email-input');
      const passwordEl = document.getElementById('password-input');
      const errorEl = document.getElementById('login-error');
      if (!emailEl || !passwordEl || !errorEl) return;
      const email = emailEl.value.trim();
      const password = passwordEl.value;
      if (!email || !password) { errorEl.textContent = 'Please enter your email and password'; return; }
      errorEl.textContent = '';
      const btn = document.getElementById('login-btn');
      btn.disabled = true; btn.textContent = 'Signing in…';
      try {
        const data = await signInWithPassword(email, password);
        const profile = await checkAdmin(data.access_token, data.user.id);
        if (!profile?.is_admin) {
          errorEl.textContent = 'This account is not an admin';
          btn.disabled = false; btn.textContent = 'Sign In';
          return;
        }
        state.accessToken = data.access_token;
        state.user = data.user;
        state.loggedIn = true;
        render();
        fetchDashboard();
      } catch (e) {
        errorEl.textContent = e.message || 'Login failed';
        btn.disabled = false; btn.textContent = 'Sign In';
      }
    }

    function handleLogout() {
      state.loggedIn = false;
      state.user = null;
      state.accessToken = null;
      state.dashboard = null;
      state.selectedUserId = null;
      state.detailUserId = null;
      state.confirmAction = null;
      state.currentView = 'dashboard';
      render();
    }

    /* ─── Helpers ──────────────────────────────────── */
    function escapeHtml(s) { const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }
    function esc(s) { return escapeHtml(s); }
    function escapeAttr(s) { return (s || '').replace(/"/g, '&quot;').replace(/'/g, '&#39;'); }
    function formatDate(iso) {
      if (!iso) return '—';
      return new Date(iso).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    }
    function formatYear(y) {
      return { '1': 'Freshman', '2': 'Sophomore', '3': 'Junior', '4': 'Senior' }[y] || y || '—';
    }
    function formatDocType(t) {
      return { student_id: 'Student ID Card', enrollment_letter: 'Enrollment Letter', class_schedule: 'Class Schedule', library_card: 'Library Card', other: 'Other' }[t] || t || '—';
    }
    function statusBadge(s) {
      const cls = s || 'none';
      const label = s ? s.charAt(0).toUpperCase() + s.slice(1) : 'None';
      return `<span class="badge badge-${cls}">${label}</span>`;
    }
    function typeColor(t) {
      return { post: { bg: 'var(--primary-subtle)', fg: 'var(--primary)' }, confession: { bg: 'var(--warning-subtle)', fg: 'var(--warning)' }, listing: { bg: 'var(--success-subtle)', fg: 'var(--success)' } }[t] || { bg: 'var(--primary-subtle)', fg: 'var(--primary)' };
    }
    function typeIcon(t) { return { post: I.post, confession: I.eye, listing: I.store }[t] || I.post; }
    function typeLabel(t) { return { post: 'Post', confession: 'Confession', listing: 'Listing' }[t] || t; }
    function showToast(msg) {
      const c = document.getElementById('toast-container');
      if (!c) return;
      const el = document.createElement('div');
      el.className = 'toast'; el.textContent = msg;
      c.appendChild(el);
      requestAnimationFrame(() => el.classList.add('show'));
      setTimeout(() => { el.classList.remove('show'); setTimeout(() => el.remove(), 300); }, 3000);
    }

    /* ─── Init ─────────────────────────────────────── */
    render();
  })();
  </script>
</body>
</html>
